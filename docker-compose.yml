version: "3.9"

services:
  api:
    build: ./api
    container_name: api
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  worker:
    build: ./worker
    container_name: worker
    restart: always
    env_file:
      - .env
    depends_on:
      - rabbitmq

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  pgdata: